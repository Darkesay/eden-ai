# ==============================================================================
# EDENS AI — ESPHome 2026.10.2 Reference ESP32-CAM Configuration
# Preserves HTTP MJPEG (:81) & JPEG Snapshot (:80) compatibility while adding
# authenticated MQTT status, LWT health reporting, and Safe-Mode OTA.
# ==============================================================================

substitutions:
  node_name: "edens-esp32cam-ref"
  friendly_name: "EDENS Canopy Camera"
  greenhouse_id: !secret edens_greenhouse_id
  device_id: !secret edens_camera_device_id

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  project:
    name: "edens_ai.esp32_cam"
    version: "2026.10.2-ref1"

esp32:
  board: esp32cam
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "EDENS-CAM-${device_id}"
    password: !secret unique_board_ap_password
    ap_timeout: 5min

captive_portal:

logger:
  level: INFO

ota:
  - platform: esphome
    password: !secret ota_password

safe_mode:
  num_attempts: 5
  reboot_timeout: 5min

# Standard AI-Thinker ESP32-CAM OV2640 Pinout (Verify if custom carrier board is used)
esp32_camera:
  name: "Greenhouse Canopy Camera"
  id: canopy_cam
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 800x600
  jpeg_quality: 12

# Local LAN Stream (:81) & Still Snapshot (:80) compatible with EDENS AI LAN HTTP & Relay Bridge
esp32_camera_web_server:
  - port: 81
    mode: stream
  - port: 80
    mode: snapshot

mqtt:
  broker: !secret edens_mqtt_host
  port: 8883
  username: "${device_id}"
  password: !secret edens_camera_key
  discovery: true
  topic_prefix: "edens/v1/greenhouses/${greenhouse_id}/devices/${device_id}"
  birth_message:
    topic: "edens/v1/greenhouses/${greenhouse_id}/devices/${device_id}/status"
    payload: "online"
  will_message:
    topic: "edens/v1/greenhouses/${greenhouse_id}/devices/${device_id}/status"
    payload: "offline"
